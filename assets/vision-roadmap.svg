<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 382" width="1200" height="382" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">CurriculumOS roadmap</title>
<desc id="d">Today a prototype; four later phases are shown dashed because none is built.</desc>
<rect width="1200" height="382" rx="14" fill="#0f172a"/>
<text x="600" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="#f8fafc">From prototype to platform: the roadmap, and what is not built</text>
<rect x="45" y="84" width="198" height="238" rx="12" fill="#111c33" stroke="#4ade80" stroke-width="2"/>
<text x="61" y="114" font-size="15.5" fill="#4ade80" text-anchor="start" font-weight="700" xml:space="preserve"><tspan x="61" dy="0">Today</tspan></text>
<line x1="61" y1="124" x2="227" y2="124" stroke="#4ade80" stroke-width="1" opacity="0.5"/>
<text x="61" y="134" font-size="12.5" fill="#94a3b8" text-anchor="start" font-style="italic" xml:space="preserve"><tspan x="61" dy="0">Single-file prototype</tspan></text>
<text x="61" y="165" font-size="13.5" fill="#e2e8f0" text-anchor="start" xml:space="preserve"><tspan x="61" dy="0">• Live audit and diff</tspan></text>
<text x="61" y="191" font-size="13.5" fill="#e2e8f0" text-anchor="start" xml:space="preserve"><tspan x="61" dy="0">• Lesson stubs</tspan></text>
<text x="61" y="217" font-size="13.5" fill="#e2e8f0" text-anchor="start" xml:space="preserve"><tspan x="61" dy="0">• Demo dashboards</tspan></text>
<rect x="61" y="233" width="58" height="24" rx="12" fill="none" stroke="#4ade80" stroke-width="1.5"/><text x="72" y="250" font-size="12.5" font-weight="700" fill="#4ade80">Built</text>
<rect x="273" y="84" width="198" height="238" rx="12" fill="#111c33" stroke="#60a5fa" stroke-width="2" stroke-dasharray="8 6"/>
<text x="289" y="114" font-size="15.5" fill="#60a5fa" text-anchor="start" font-weight="700" xml:space="preserve"><tspan x="289" dy="0">Phase 1</tspan></text>
<line x1="289" y1="124" x2="455" y2="124" stroke="#60a5fa" stroke-width="1" opacity="0.5"/>
<text x="289" y="134" font-size="12.5" fill="#94a3b8" text-anchor="start" font-style="italic" xml:space="preserve"><tspan x="289" dy="0">Harden the core, 0 to 6</tspan><tspan x="289" dy="17">months</tspan></text>
<text x="289" y="182" font-size="13.5" fill="#e2e8f0" text-anchor="start" xml:space="preserve"><tspan x="289" dy="0">• Accounts and database</tspan></text>
<text x="289" y="208" font-size="13.5" fill="#e2e8f0" text-anchor="start" xml:space="preserve"><tspan x="289" dy="0">• Server-side API proxy</tspan></text>
<text x="289" y="234" font-size="13.5" fill="#e2e8f0" text-anchor="start" xml:space="preserve"><tspan x="289" dy="0">• Live standards data</tspan></text>
<rect x="289" y="250" width="86" height="24" rx="12" fill="none" stroke="#60a5fa" stroke-width="1.5"/><text x="300" y="267" font-size="12.5" font-weight="700" fill="#60a5fa">Not built</text>
<rect x="501" y="84" width="198" height="238" rx="12" fill="#111c33" stroke="#60a5fa" stroke-width="2" stroke-dasharray="8 6"/>
<text x="517" y="114" font-size="15.5" fill="#60a5fa" text-anchor="start" font-weight="700" xml:space="preserve"><tspan x="517" dy="0">Phase 2</tspan></text>
<line x1="517" y1="124" x2="683" y2="124" stroke="#60a5fa" stroke-width="1" opacity="0.5"/>
<text x="517" y="134" font-size="12.5" fill="#94a3b8" text-anchor="start" font-style="italic" xml:space="preserve"><tspan x="517" dy="0">Institutional, 6 to 12</tspan><tspan x="517" dy="17">months</tspan></text>
<text x="517" y="182" font-size="13.5" fill="#e2e8f0" text-anchor="start" xml:space="preserve"><tspan x="517" dy="0">• School workspaces</tspan></text>
<text x="517" y="208" font-size="13.5" fill="#e2e8f0" text-anchor="start" xml:space="preserve"><tspan x="517" dy="0">• LMS integrations</tspan></text>
<text x="517" y="234" font-size="13.5" fill="#e2e8f0" text-anchor="start" xml:space="preserve"><tspan x="517" dy="0">• Review workflows</tspan></text>
<rect x="517" y="250" width="86" height="24" rx="12" fill="none" stroke="#60a5fa" stroke-width="1.5"/><text x="528" y="267" font-size="12.5" font-weight="700" fill="#60a5fa">Not built</text>
<rect x="729" y="84" width="198" height="238" rx="12" fill="#111c33" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="8 6"/>
<text x="745" y="114" font-size="15.5" fill="#c4b5fd" text-anchor="start" font-weight="700" xml:space="preserve"><tspan x="745" dy="0">Phase 3</tspan></text>
<line x1="745" y1="124" x2="911" y2="124" stroke="#c4b5fd" stroke-width="1" opacity="0.5"/>
<text x="745" y="134" font-size="12.5" fill="#94a3b8" text-anchor="start" font-style="italic" xml:space="preserve"><tspan x="745" dy="0">Intelligence, 12 to 24</tspan><tspan x="745" dy="17">months</tspan></text>
<text x="745" y="182" font-size="13.5" fill="#e2e8f0" text-anchor="start" xml:space="preserve"><tspan x="745" dy="0">• Calibration flywheel</tspan></text>
<text x="745" y="208" font-size="13.5" fill="#e2e8f0" text-anchor="start" xml:space="preserve"><tspan x="745" dy="0">• Peer benchmarking</tspan></text>
<text x="745" y="234" font-size="13.5" fill="#e2e8f0" text-anchor="start" xml:space="preserve"><tspan x="745" dy="0">• Predictive gap detection</tspan></text>
<text x="745" y="260" font-size="13.5" fill="#e2e8f0" text-anchor="start" xml:space="preserve"><tspan x="745" dy="0">• Curriculum co-pilot</tspan></text>
<rect x="745" y="276" width="86" height="24" rx="12" fill="none" stroke="#c4b5fd" stroke-width="1.5"/><text x="756" y="293" font-size="12.5" font-weight="700" fill="#c4b5fd">Not built</text>
<rect x="957" y="84" width="198" height="238" rx="12" fill="#111c33" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="973" y="114" font-size="15.5" fill="#94a3b8" text-anchor="start" font-weight="700" xml:space="preserve"><tspan x="973" dy="0">Phase 4</tspan></text>
<line x1="973" y1="124" x2="1139" y2="124" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>
<text x="973" y="134" font-size="12.5" fill="#94a3b8" text-anchor="start" font-style="italic" xml:space="preserve"><tspan x="973" dy="0">Expansion, 24+ months</tspan></text>
<text x="973" y="165" font-size="13.5" fill="#e2e8f0" text-anchor="start" xml:space="preserve"><tspan x="973" dy="0">• Higher education</tspan></text>
<text x="973" y="191" font-size="13.5" fill="#e2e8f0" text-anchor="start" xml:space="preserve"><tspan x="973" dy="0">• EdTech and test prep</tspan></text>
<text x="973" y="217" font-size="13.5" fill="#e2e8f0" text-anchor="start" xml:space="preserve"><tspan x="973" dy="0">• Corporate learning</tspan></text>
<text x="973" y="243" font-size="13.5" fill="#e2e8f0" text-anchor="start" xml:space="preserve"><tspan x="973" dy="0">• International</tspan></text>
<rect x="973" y="259" width="86" height="24" rx="12" fill="none" stroke="#94a3b8" stroke-width="1.5"/><text x="984" y="276" font-size="12.5" font-weight="700" fill="#94a3b8">Not built</text>
<text x="600" y="352" text-anchor="middle" font-size="13" fill="#94a3b8">Timelines are the README's own estimates, not commitments. The validation roadmap says what must be proven first.</text>
</svg>
